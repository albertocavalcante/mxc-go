\* The original design (streams closed before the kill). TLC is EXPECTED to
\* report a deadlock; scripts/check-formal.sh asserts that it does, so the
\* model cannot silently become vacuous.
SPECIFICATION Spec
CONSTANTS Fixed = FALSE ChildMayExit = FALSE KillerRuns = FALSE
INVARIANTS TypeOK NoStreamUseAfterFree NoHandleUseAfterFree NoDoubleFree NoLeakAtEnd
PROPERTY EventuallyTerminates
